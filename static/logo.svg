<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Eggplant body (dark purple) -->
  <ellipse cx="50" cy="60" rx="30" ry="40" fill="#6A0DAD"/>

  <!-- Stem (green) -->
  <path d="M 50 15 Q 45 5 40 10 L 42 20 Q 48 25 50 15 Z" fill="#228B22"/>
  <path d="M 50 15 Q 55 5 60 10 L 58 20 Q 52 25 50 15 Z" fill="#228B22"/>

  <!-- Grinning mouth (darker purple for contrast) -->
  <path d="M 35 70 Q 50 80 65 70" stroke="#300060" stroke-width="3" fill="none"/>

  <!-- Winking eye (right eye, closed with an arc) -->
  <path d="M 60 45 C 65 40, 65 50, 60 45" stroke="#000" stroke-width="2" fill="none"/>
  
  <!-- Open eye (left eye) -->
  <circle cx="40" cy="45" r="3" fill="#000"/>

  <!-- Red tie knot -->
  <circle cx="50" cy="70" r="8" fill="#FF0000"/>
  <path d="M 50 78 L 45 88 L 55 88 Z" fill="#FF0000"/>
</svg>