<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Results - Adultlyf</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #fff;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #333;
            padding: 1rem;
            text-align: center;
        }
        header h1 {
            margin: 0;
            font-size: 2rem;
        }
        .search-info {
            text-align: center;
            padding: 1rem;
            background-color: #2a2a2a;
            margin-bottom: 1rem;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem;
        }
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }
        .video-item {
            background-color: #2a2a2a;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            transition: transform 0.2s;
        }
        .video-item:hover {
            transform: scale(1.05);
        }
        .video-item img {
            width: 100%;
            height: auto;
        }
        .video-item-title {
            padding: 1rem;
            font-size: 1.1rem;
            font-weight: bold;
        }
        .loading {
            text-align: center;
            padding: 3rem 2rem;
            color: #fff;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px;
            margin: 2rem 0;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        .loading h2 {
            margin: 0 0 1rem 0;
            font-size: 1.8rem;
            font-weight: bold;
        }
        .loading p {
            margin: 0 0 1.5rem 0;
            font-size: 1.1rem;
            opacity: 0.9;
        }
        .countdown {
            font-size: 3rem;
            font-weight: bold;
            color: #ffd700;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
            margin: 1rem 0;
            font-family: 'Courier New', monospace;
        }
        .loading-spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            margin-bottom: 1rem;
        }
        .countdown-container {
            margin-top: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .countdown-circle {
            position: relative;
            margin-bottom: 1rem;
        }
        .countdown-circle svg circle {
            transition: stroke-dashoffset 0.1s linear;
        }
        .countdown-number {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2.5rem;
            font-weight: bold;
            color: #ffd700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.8);
            font-family: 'Courier New', monospace;
        }
        .countdown-text {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.8);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .no-results {
            text-align: center;
            padding: 2rem;
            color: #ccc;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 1rem;
            color: #4CAF50;
            text-decoration: none;
        }
        .back-link:hover {
            text-decoration: underline;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            header {
                padding: 0.5rem;
            }

            header h1 {
                font-size: 1.5rem;
            }

            .container {
                padding: 0.5rem;
            }

            .search-info {
                padding: 0.75rem;
                font-size: 0.9rem;
            }

            .video-grid {
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
                gap: 1rem;
            }

            .video-item-title {
                font-size: 1rem;
                padding: 0.75rem;
            }

            .loading {
                padding: 2rem 1rem;
                margin: 1rem 0;
            }

            .loading h2 {
                font-size: 1.4rem;
            }

            .loading p {
                font-size: 1rem;
            }

            .countdown {
                font-size: 2rem;
            }

            .countdown-number {
                font-size: 2rem !important;
            }

            .countdown-circle svg {
                width: 100px !important;
                height: 100px !important;
            }

            .site-logo img {
                height: 50px !important;
            }
        }

        @media (max-width: 480px) {
            header h1 {
                font-size: 1.2rem;
            }

            .container {
                padding: 0.25rem;
            }

            .search-info {
                padding: 0.5rem;
                font-size: 0.8rem;
            }

            .video-grid {
                grid-template-columns: 1fr;
                gap: 0.75rem;
            }

            .video-item {
                margin: 0 auto;
            }

            .video-item-title {
                font-size: 0.9rem;
                padding: 0.5rem;
            }

            .loading {
                padding: 1.5rem 0.5rem;
                margin: 0.75rem 0;
            }

            .loading h2 {
                font-size: 1.2rem;
            }

            .loading p {
                font-size: 0.9rem;
            }

            .countdown {
                font-size: 1.5rem;
            }

            .countdown-number {
                font-size: 1.5rem !important;
            }

            .countdown-circle svg {
                width: 80px !important;
                height: 80px !important;
            }

            .no-results {
                padding: 1rem;
                font-size: 0.9rem;
            }

            .site-logo {
                left: 0.5rem !important;
            }

            .site-logo img {
                height: 40px !important;
                margin-right: 10px;
            }

            .back-link {
                font-size: 0.9rem;
            }
        }

        /* Touch-friendly buttons */
        @media (hover: none) and (pointer: coarse) {
            .video-item {
                min-height: 150px;
            }
        }
    </style>
</head>
<body>
    <header>
        <a href="/" class="site-logo" style="position: absolute; left: 1rem; top: 10px;">
            <img src="/static/logo.svg" alt="Adultlyf Logo" style="height: 80px; width: auto; vertical-align: middle; margin-right: 15px;">
        </a>
        <h1>Adultlyf - Search Results</h1>
    </header>
    <div class="container">
        <a href="index.html" class="back-link">&larr; Back to Home</a>
        <div id="search-info" class="search-info"></div>
        <div id="results-container">
            <div class="loading">Searching for videos...</div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const urlParams = new URLSearchParams(window.location.search);
            const query = urlParams.get('q');

            if (!query) {
                document.getElementById('results-container').innerHTML = '<div class="no-results">No search query provided.</div>';
                return;
            }

            document.getElementById('search-info').textContent = `Search results for: "${decodeURIComponent(query)}"`;

            // First, show local results immediately
            fetch("videos.json")
                .then(response => response.json())
                .then(data => {
                    const localResults = data.filter(video =>
                        video.title.toLowerCase().includes(query.toLowerCase())
                    );

                    if (localResults.length > 0) {
                        displayResults(localResults, `Found ${localResults.length} local results`);
                    }

                    // Then scrape for more results
                    return performSearch(query);
                })
                .catch(error => {
                    console.error("Error loading videos:", error);
                    return performSearch(query);
                });
        });

        async function performSearch(searchTerm) {
            // Show loading screen
            showLoadingScreen(searchTerm);

            try {
                const response = await fetch(`/api/search?q=${encodeURIComponent(searchTerm)}`);

                const result = await response.json();

                if (result.success && result.videos && result.videos.length > 0) {
                    displayResults(result.videos, `Found ${result.total_results} total results`);
                } else {
                    // No videos found, just show local results if any
                    fetch("videos.json")
                        .then(response => response.json())
                        .then(data => {
                            const localResults = data.filter(video =>
                                video.title.toLowerCase().includes(searchTerm.toLowerCase())
                            );

                            if (localResults.length > 0) {
                                displayResults(localResults, `Found ${localResults.length} local results`);
                            } else {
                                document.getElementById('results-container').innerHTML =
                                    '<div class="no-results">No videos found for this search term.</div>';
                            }
                        });
                }
            } catch (error) {
                console.error('Error during scraping:', error);
                // On error, fall back to showing local results
                fetch("videos.json")
                    .then(response => response.json())
                    .then(data => {
                        const localResults = data.filter(video =>
                            video.title.toLowerCase().includes(searchTerm.toLowerCase())
                        );

                        if (localResults.length > 0) {
                            displayResults(localResults, `Found ${localResults.length} local results (scraping failed)`);
                        } else {
                            document.getElementById('results-container').innerHTML =
                                '<div class="no-results">Error occurred while searching. Please try again later.</div>';
                        }
                    })
                    .catch(localError => {
                        console.error('Error loading local videos:', localError);
                        document.getElementById('results-container').innerHTML =
                            '<div class="no-results">Error occurred while searching. Please try again later.</div>';
                    });
            }
        }

        function showLoadingScreen(searchTerm) {
            const container = document.getElementById('results-container');
            let countdown = 20; // 20 second countdown

            const loadingHtml = `
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <h2>🎥 Searching for "${searchTerm}"</h2>
                    <p>Please wait while we search across multiple adult sites...</p>
                    <div class="countdown-container">
                        <div class="countdown-circle">
                            <svg width="120" height="120" viewBox="0 0 120 120">
                                <circle cx="60" cy="60" r="54" stroke="#333" stroke-width="6" fill="none"/>
                                <circle cx="60" cy="60" r="54" stroke="#ff6b6b" stroke-width="6" fill="none"
                                        stroke-dasharray="339.29" stroke-dashoffset="0"
                                        transform="rotate(-90 60 60)" id="countdown-circle"/>
                            </svg>
                            <div class="countdown-number">${countdown}</div>
                        </div>
                        <div class="countdown-text">seconds remaining</div>
                    </div>
                </div>
            `;

            container.innerHTML = loadingHtml;

            // Animate the countdown circle
            const circle = document.getElementById('countdown-circle');
            const circumference = 2 * Math.PI * 54; // radius = 54
            const totalTime = countdown * 1000;
            const updateInterval = 100; // Update every 100ms

            let timeLeft = countdown;
            const interval = setInterval(() => {
                timeLeft -= updateInterval / 1000;
                const progress = Math.max(0, timeLeft / countdown);
                const offset = circumference * (1 - progress);

                if (circle) {
                    circle.style.strokeDashoffset = offset;
                }

                const countdownElement = document.querySelector('.countdown-number');
                if (countdownElement) {
                    countdownElement.textContent = Math.ceil(timeLeft);
                }

                if (timeLeft <= 0) {
                    clearInterval(interval);
                }
            }, updateInterval);
        }

        function displayResults(videos, infoText = '') {
            const container = document.getElementById('results-container');

            let html = '';
            if (infoText) {
                html += `<div class="search-info" style="margin-bottom: 1rem;">${infoText}</div>`;
            }

            if (videos.length === 0) {
                html += '<div class="no-results">No videos found.</div>';
            } else {
                html += '<div class="video-grid">';

                videos.forEach(video => {
                    const params = new URLSearchParams({
                        embed_url: encodeURIComponent(video.embed_url),
                        video_url: encodeURIComponent(video.video_url),
                        title: encodeURIComponent(video.title)
                    });

                    html += `
                        <div class="video-item" onclick="window.open('player.html?${params.toString()}', '_blank')">
                            <img src="${video.thumbnail}" alt="${video.title}" loading="lazy">
                            <div class="video-item-title">${video.title}</div>
                        </div>
                    `;
                });

                html += '</div>';
            }

            container.innerHTML = html;
        }
    </script>
</body>
</html>
