<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat - Adultlyf</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .chat-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 800px;
            height: 90vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 1.2em;
            font-weight: bold;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9fa;
        }

        .message {
            margin-bottom: 15px;
            padding: 12px 16px;
            border-radius: 18px;
            max-width: 70%;
            word-wrap: break-word;
            position: relative;
        }

        .message.admin {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            margin-left: auto;
            border-bottom-right-radius: 5px;
        }

        .message.client {
            background: #e9ecef;
            color: #333;
            margin-right: auto;
            border-bottom-left-radius: 5px;
        }

        .message.system {
            background: #fff3cd;
            color: #856404;
            text-align: center;
            margin: 10px auto;
            max-width: 80%;
            font-style: italic;
        }

        .message-image {
            max-width: 200px;
            max-height: 200px;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s;
            user-select: none;
            -webkit-user-drag: none;
            -khtml-user-drag: none;
            -moz-user-drag: none;
            -o-user-drag: none;
        }

        .message-image:hover {
            transform: scale(1.05);
        }

        .image-caption {
            margin-top: 8px;
            font-size: 0.9em;
            color: #666;
            max-width: 200px;
            word-wrap: break-word;
        }

        .image-caption {
            margin-top: 8px;
            font-size: 0.9em;
            color: #666;
            max-width: 200px;
            word-wrap: break-word;
        }

        .image-caption {
            margin-top: 8px;
            font-size: 0.9em;
            color: #666;
            max-width: 200px;
            word-wrap: break-word;
        }

        .message-time {
            font-size: 0.8em;
            opacity: 0.7;
            margin-top: 5px;
        }

        .chat-input {
            padding: 20px;
            background: white;
            border-top: 1px solid #e9ecef;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .message-input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e9ecef;
            border-radius: 25px;
            outline: none;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .message-input:focus {
            border-color: #667eea;
        }

        .send-button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s;
        }

        .send-button:hover {
            transform: translateY(-2px);
        }

        .image-upload {
            display: none;
        }

        .image-upload-label {
            padding: 12px;
            background: #28a745;
            color: white;
            border-radius: 50%;
            cursor: pointer;
            display: flex !important;
            align-items: center;
            justify-content: center;
            width: 45px;
            height: 45px;
            transition: transform 0.2s;
        }

        .image-upload-label:hover {
            transform: translateY(-2px);
        }

        /* Modal for image zoom */
        .image-modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.9);
            justify-content: center;
            align-items: center;
        }

        .image-modal-content {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            user-select: none;
            -webkit-user-drag: none;
            -khtml-user-drag: none;
            -moz-user-drag: none;
            -o-user-drag: none;
        }

        .image-modal-close {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 10px;
            border-radius: 5px;
            margin: 10px;
            text-align: center;
        }

        @media (max-width: 768px) {
            .chat-container {
                height: 100vh;
                border-radius: 0;
            }

            .message {
                max-width: 85%;
            }

            .message-image {
                max-width: 150px;
                max-height: 150px;
            }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            Chat Session
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="loading">Loading messages...</div>
        </div>

        <div class="chat-input">
            <input type="file" id="imageUpload" class="image-upload" accept="image/*">
            <label for="imageUpload" class="image-upload-label" id="imageUploadLabel" title="Send Image">
                📷
            </label>
            <input type="text" id="messageInput" class="message-input" placeholder="Type your message..." maxlength="500">
            <button id="sendButton" class="send-button">Send</button>
        </div>
    </div>

    <!-- Image Modal -->
    <div id="imageModal" class="image-modal">
        <span class="image-modal-close">&times;</span>
        <img id="modalImage" class="image-modal-content" alt="Zoomed image">
    </div>

    <script>
        // Get request ID from URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const requestId = urlParams.get('request_id');

        if (!requestId) {
            document.getElementById('chatMessages').innerHTML = '<div class="error">No chat session found. Please check your meeting request.</div>';
        }

        let isAdmin = false;
        let pollInterval;

        // Store current chat in localStorage for persistence
        if (requestId) {
            localStorage.setItem('currentChatRequestId', requestId);
            localStorage.setItem('lastChatAccess', Date.now().toString());
        } else {
            // Try to restore from localStorage
            const storedRequestId = localStorage.getItem('currentChatRequestId');
            const lastAccess = localStorage.getItem('lastChatAccess');

            if (storedRequestId) {
                // Check if chat is still active (not ended by admin)
                fetch(`/chat/${storedRequestId}`)
                    .then(response => response.json())
                    .then(data => {
                        // Check if chat was ended by admin
                        const isEnded = data.messages && data.messages.some(msg =>
                            msg.sender === 'system' && msg.message === 'Chat session ended by administrator'
                        );

                        if (!isEnded) {
                            // Chat is still active, redirect to resume
                            window.location.href = `?request_id=${storedRequestId}`;
                            return;
                        } else {
                            // Chat was ended by admin, clear localStorage
                            localStorage.removeItem('currentChatRequestId');
                            localStorage.removeItem('lastChatAccess');
                            document.getElementById('chatMessages').innerHTML = '<div class="message system">Your previous chat session has ended. Please start a new meeting request to chat again.</div>';
                        }
                    })
                    .catch(error => {
                        console.error('Error checking chat status:', error);
                        // If we can't check, assume chat is still active
                        window.location.href = `?request_id=${storedRequestId}`;
                        return;
                    });
                return; // Wait for async check
            }
        }

        // Check if user is admin (has admin session)
        fetch('/admin/escorts', { credentials: 'same-origin' })
            .then(response => {
                if (response.ok) {
                    isAdmin = true;
                }
            })
            .catch(() => {
                // Not admin, that's fine
            })
            .finally(() => {
                // Show image upload for ALL users (both clients and admins)
                const imageLabel = document.getElementById('imageUploadLabel');
                const imageUpload = document.getElementById('imageUpload');

                // Ensure the upload button is visible and accessible
                imageLabel.style.display = 'flex';
                imageLabel.style.visibility = 'visible';
                imageLabel.style.opacity = '1';

                // Make sure the file input is enabled
                imageUpload.disabled = false;

                console.log('Image upload button is now visible for ' + (isAdmin ? 'admin' : 'client'));
                loadMessages();
                startPolling();
            });

        function loadMessages() {
            if (!requestId) return;

            fetch(`/chat/${requestId}`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                    }
                    return response.json();
                })
                .then(data => {
                    console.log('Received messages:', data.messages); // Debug log
                    displayMessages(data.messages);
                })
                .catch(error => {
                    console.error('Error loading messages:', error);
                    // Don't stop polling on errors - just log and continue
                    // Only show error if it's been failing for a while
                    if (!window.consecutiveErrors) {
                        window.consecutiveErrors = 0;
                    }
                    window.consecutiveErrors++;

                    if (window.consecutiveErrors >= 5) {
                        document.getElementById('chatMessages').innerHTML = '<div class="error">Connection lost. Please refresh the page to reconnect.</div>';
                        // Stop polling after too many consecutive errors
                        if (pollInterval) {
                            clearInterval(pollInterval);
                            pollInterval = null;
                        }
                    }
                });
        }

        function displayMessages(messages) {
            const container = document.getElementById('chatMessages');

            console.log('DEBUG: Displaying messages:', messages);

            if (messages.length === 0) {
                container.innerHTML = '<div class="message system">No messages yet. Start the conversation!</div>';
                return;
            }

            container.innerHTML = messages.map(msg => {
                const messageClass = msg.sender === 'admin' ? 'admin' : msg.sender === 'client' ? 'client' : 'system';
                const timeString = new Date(msg.timestamp).toLocaleString();

                let content = '';

                if (msg.image_url) {
                    // Display the image using the image_url
                    console.log('DEBUG: Found image_url:', msg.image_url);
                    content = `<img src="${msg.image_url}" alt="Sent image" class="message-image" onclick="openImageModal('${msg.image_url}')" onerror="console.error('Image failed to load:', '${msg.image_url}')">`;

                    // If there's also a message (caption), display it below the image
                    if (msg.message) {
                        // Check if message contains HTML (like admin-generated img tags)
                        if (msg.message.startsWith('<img') && msg.message.includes('src=')) {
                            // This is HTML content (admin-generated image with caption)
                            content += `<div class="image-caption">${msg.message}</div>`;
                        } else {
                            // This is plain text caption
                            content += `<div class="image-caption">${msg.message.replace(/\n/g, '<br>')}</div>`;
                        }
                    }
                } else if (msg.message) {
                    // Regular text message - check if it contains HTML
                    if (msg.message.startsWith('<img') && msg.message.includes('src=')) {
                        // This is HTML content (admin-generated image)
                        content = msg.message;
                    } else {
                        // Regular text message
                        content = `<div>${msg.message.replace(/\n/g, '<br>')}</div>`;
                        console.log('DEBUG: Regular text message:', msg);
                    }
                }

                return `
                    <div class="message ${messageClass}">
                        ${content}
                        <div class="message-time">${timeString}</div>
                    </div>
                `;
            }).join('');

            // Scroll to bottom
            container.scrollTop = container.scrollHeight;
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            const imageFile = document.getElementById('imageUpload').files[0];

            if (!message && !imageFile) return;

            // Prepare form data for image upload
            if (imageFile) {
                const formData = new FormData();
                formData.append('image', imageFile);
                if (message) {
                    formData.append('message', message);
                }

                fetch(`/chat/${requestId}`, {
                    method: 'POST',
                    body: formData,
                    credentials: 'same-origin'
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        input.value = '';
                        document.getElementById('imageUpload').value = '';
                        loadMessages(); // Refresh messages
                    } else {
                        alert('Error sending message: ' + data.error);
                    }
                })
                .catch(error => {
                    console.error('Error sending message:', error);
                    alert('Failed to send message. Please try again.');
                });
            } else {
                // Regular text message
                fetch(`/chat/${requestId}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        sender: isAdmin ? 'admin' : 'client',
                        message: message
                    }),
                    credentials: 'same-origin'
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        input.value = '';
                        loadMessages(); // Refresh messages
                    } else {
                        alert('Error sending message: ' + data.error);
                    }
                })
                .catch(error => {
                    console.error('Error sending message:', error);
                    alert('Failed to send message. Please try again.');
                });
            }
        }

        function openImageModal(imageUrl) {
            const modal = document.getElementById('imageModal');
            const modalImg = document.getElementById('modalImage');
            modal.style.display = 'flex';
            modalImg.src = imageUrl;
        }

        function closeImageModal() {
            document.getElementById('imageModal').style.display = 'none';
        }

        function startPolling() {
            pollInterval = setInterval(loadMessages, 3000); // Poll every 3 seconds
        }

        // Event listeners
        document.getElementById('sendButton').addEventListener('click', sendMessage);

        document.getElementById('messageInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        document.getElementById('imageUpload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file && !file.type.startsWith('image/')) {
                alert('Please select an image file.');
                e.target.value = '';
            }
        });

        document.querySelector('.image-modal-close').addEventListener('click', closeImageModal);

        document.getElementById('imageModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeImageModal();
            }
        });

        // Prevent image downloads and right-click
        document.addEventListener('contextmenu', function(e) {
            if (e.target.classList.contains('message-image') || e.target.classList.contains('image-modal-content')) {
                e.preventDefault();
                return false;
            }
        });

        // Prevent drag and drop of images
        document.addEventListener('dragstart', function(e) {
            if (e.target.classList.contains('message-image') || e.target.classList.contains('image-modal-content')) {
                e.preventDefault();
                return false;
            }
        });

        // Clean up on page unload
        window.addEventListener('beforeunload', function() {
            if (pollInterval) {
                clearInterval(pollInterval);
            }
        });
    </script>
</body>
</html>
