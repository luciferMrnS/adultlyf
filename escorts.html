<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escorts - Adultlyf</title>
    <link rel="icon" type="image/svg+xml" href="/static/logo.svg">
    <link rel="apple-touch-icon" href="/static/logo.svg">
        <link rel="stylesheet" href="/static/main.css">
    <style>
        /* Escort Page Specific Styles - Girlish & Colorful Theme */
        .escort-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 2rem;
        }

        .escort-card {
            background-color: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.4);
            border: 1px solid #444;
            transition: all 0.3s ease-out;
            backdrop-filter: blur(5px);
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .escort-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 25px rgba(0,0,0,0.6), 0 0 20px rgba(233, 64, 87, 0.4);
            border-color: #E94057;
        }

        .photo-album {
            height: 400px;
            position: relative;
            cursor: pointer;
        }
        
        .photo-album img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            opacity: 0;
            transition: opacity 0.4s ease-in-out;
        }

        .photo-album img.active {
            opacity: 1;
        }

        .photo-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0,0,0,0.4);
            color: white;
            border: none;
            padding: 0.5rem;
            cursor: pointer;
            font-size: 1.5rem;
            z-index: 10;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            line-height: 30px;
            text-align: center;
        }
        .photo-nav:hover {
            background: rgba(0,0,0,0.7);
        }
        .photo-nav.prev { left: 10px; }
        .photo-nav.next { right: 10px; }

        .escort-info {
            padding: 1.5rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .escort-name {
            font-size: 1.75rem;
            font-weight: 700;
            color: #E94057;
            text-shadow: 0 0 8px rgba(233, 64, 87, 0.5);
            margin-bottom: 0.75rem;
        }

        .escort-details {
            margin-bottom: 1.5rem;
            flex-grow: 1;
        }
        .escort-details p {
            margin: 0.3rem 0;
            color: #ccc;
            font-size: 0.95rem;
        }
        .escort-details p strong {
            color: #8A2BE2;
        }

        .meet-btn, .submit-btn, .become-model-btn, .gallery-back-btn, .chat-send-btn {
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 50px;
            background: linear-gradient(45deg, #E94057, #8A2BE2);
            color: white;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 0 5px rgba(0,0,0,0.7);
            transition: all 0.4s ease;
            box-shadow: 0 0 15px rgba(138, 43, 226, 0.4), 0 0 15px rgba(233, 64, 87, 0.4);
            width: 100%;
            margin-top: auto; /* Pushes button to bottom */
        }

        .meet-btn:hover, .submit-btn:hover, .become-model-btn:hover, .gallery-back-btn:hover, .chat-send-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(138, 43, 226, 0.7), 0 0 25px rgba(233, 64, 87, 0.7);
        }

        /* Filter Styles */
        .filter-section {
            background: rgba(0,0,0,0.2);
            padding: 1.5rem;
            border-radius: 12px;
            margin-bottom: 2rem;
            border: 1px solid #444;
            backdrop-filter: blur(5px);
        }
        .filter-section h3 {
            margin: 0 0 1rem 0;
            color: #8A2BE2;
            text-shadow: 0 0 8px rgba(138, 43, 226, 0.5);
        }
        .filter-btn {
            padding: 0.6rem 1.2rem;
            border: 1px solid #E94057;
            border-radius: 20px;
            background-color: transparent;
            color: #E94057;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }
        .filter-btn:hover {
            background-color: #E94057;
            color: #fff;
            box-shadow: 0 0 15px #E94057;
        }
        .filter-btn.active {
            background-color: #E94057;
            color: #fff;
            box-shadow: 0 0 15px #E94057;
        }

        /* Modal Styles */
        .modal {
             background-color: rgba(0, 0, 0, 0.7);
             backdrop-filter: blur(8px);
             display: none;
             position: fixed;
             z-index: 1000;
             left: 0;
             top: 0;
             width: 100%;
             height: 100%;
             overflow: auto;
        }
        .modal-content {
            background-color: rgba(10, 0, 10, 0.6);
            border-radius: 15px;
            border: 1px solid #E94057;
            box-shadow: 0 10px 40px rgba(0,0,0,0.7), 0 0 30px rgba(233, 64, 87, 0.4);
            margin: 10% auto;
            padding: 2rem;
            width: 80%;
            max-width: 600px;
            position: relative;
        }
        
        .modal-content h2 {
            color: #8A2BE2;
            text-align: center;
            font-size: 2rem;
            text-shadow: 0 0 10px rgba(138, 43, 226, 0.5);
        }
        .close {
            color: #fff;
            opacity: 0.7;
            font-size: 2rem;
            transition: all 0.3s ease;
            position: absolute;
            right: 1rem;
            top: 0.5rem;
            cursor: pointer;
            font-weight: bold;
        }
        .close:hover {
            opacity: 1;
            transform: rotate(90deg);
        }

        /* Form Styles */
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            color: #8A2BE2;
            margin-bottom: 0.75rem;
            font-weight: 600;
            display: block;
        }
        .form-group input,
        .form-group textarea,
        .form-group select {
            background-color: rgba(0,0,0,0.3);
            border: 1px solid #555;
            border-radius: 8px;
            color: #fff;
            padding: 0.8rem;
            transition: all 0.3s ease;
            width: 100%;
            font-size: 1rem;
        }
        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }
        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #E94057;
            box-shadow: 0 0 15px rgba(233, 64, 87, 0.5);
        }
        .submit-btn {
            margin-top: 1rem;
            padding: 0.8rem 1.5rem;
            width: 100%;
        }

        /* Back Link */
        .back-link {
            padding: 0.6rem 1.2rem;
            border: 1px solid #8A2BE2;
            border-radius: 20px;
            background-color: transparent;
            color: #8A2BE2;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
            margin-bottom: 2rem;
        }
        .back-link:hover {
            background-color: #8A2BE2;
            color: #fff;
            box-shadow: 0 0 15px #8A2BE2;
            text-decoration: none;
        }

        /* Modern Chat Interface Styles */
        .chat-modal-content {
            background: linear-gradient(145deg, rgba(30, 10, 40, 0.95), rgba(50, 20, 60, 0.95));
            border-radius: 20px;
            border: 2px solid rgba(233, 64, 87, 0.3);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), 0 0 30px rgba(233, 64, 87, 0.2);
            max-width: 450px;
            width: 90vw;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1001;
            overflow: hidden;
        }

        .chat-header {
            background: linear-gradient(135deg, #E94057, #8A2BE2);
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .chat-modal-content.minimized {
            height: auto;
            max-height: 60px;
            transition: all 0.3s ease;
        }

        .chat-modal-content.minimized .chat-messages,
        .chat-modal-content.minimized .chat-input-container {
            display: none;
        }

        .chat-modal-content.minimized .chat-header {
            border-radius: 0 0 20px 20px;
        }

        .chat-header-info {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .chat-avatar {
            width: 40px;
            height: 40px;
            background: linear-gradient(45deg, #E94057, #4CC9F0);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            box-shadow: 0 0 15px rgba(233, 64, 87, 0.4);
        }

        .chat-title h3 {
            margin: 0;
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }

        .chat-status {
            color: #90EE90; /* LightGreen */
            font-size: 0.8rem;
            font-weight: 500;
            display: block;
            text-shadow: 0 0 5px rgba(144, 238, 144, 0.5);
        }

        .chat-close-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            font-size: 1.5rem;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .chat-close-btn:hover {
            background: rgba(255, 255, 255, 0.4);
            transform: scale(1.1);
        }

        .chat-minimize-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            font-size: 1.5rem;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .chat-minimize-btn:hover {
            background: rgba(255, 255, 255, 0.4);
            transform: scale(1.1);
        }

        .chat-messages {
            flex: 1;
            max-height: 400px;
            overflow-y: auto;
            padding: 1.5rem;
            background: rgba(0, 0, 0, 0.1);
            scrollbar-width: thin;
            scrollbar-color: rgba(233, 64, 87, 0.3) transparent;
        }

        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: rgba(233, 64, 87, 0.3);
            border-radius: 3px;
        }

        .chat-messages::-webkit-scrollbar-thumb:hover {
            background: rgba(233, 64, 87, 0.5);
        }

        .chat-message {
            margin-bottom: 1rem;
            padding: 0.75rem 1rem;
            border-radius: 18px;
            max-width: 75%;
            word-wrap: break-word;
            position: relative;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .chat-message.system {
            background: linear-gradient(135deg, rgba(138, 43, 226, 0.2), rgba(233, 64, 87, 0.2));
            color: #4CC9F0;
            text-align: center;
            margin: 0.5rem auto;
            font-style: italic;
            font-size: 0.85rem;
            border: 1px solid rgba(138, 43, 226, 0.3);
            max-width: 90%;
        }

        .chat-message.admin {
            background: linear-gradient(135deg, #8A2BE2, #6a1a9a);
            color: white;
            margin-left: auto;
            margin-right: 0;
            text-align: left;
            border-bottom-right-radius: 5px;
            box-shadow: 0 2px 10px rgba(138, 43, 226, 0.3);
        }

        .chat-message.client {
            background: linear-gradient(135deg, #E94057, #d43a50);
            color: white;
            margin-right: auto;
            margin-left: 0;
            text-align: left;
            border-bottom-left-radius: 5px;
            box-shadow: 0 2px 10px rgba(233, 64, 87, 0.3);
        }

        .chat-message.client .chat-message-image {
            align-self: flex-start;
            margin-left: 0;
            margin-right: auto;
        }

        .message-content {
            margin-bottom: 0.25rem;
            line-height: 1.4;
        }

        .message-time {
            font-size: 0.7rem;
            opacity: 0.7;
            text-align: right;
        }

        .chat-message-image {
            max-width: 200px;
            max-height: 200px;
            border-radius: 12px;
            cursor: pointer;
            margin: 0.5rem 0;
            transition: transform 0.2s ease;
        }

        .chat-message-image:hover {
            transform: scale(1.02);
        }

        .chat-image-preview {
            margin: 0.5rem 1.5rem;
            padding: 0.75rem;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: none;
        }

        .preview-content {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .preview-content img {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 8px;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .preview-info {
            flex: 1;
        }

        .filename {
            color: #4CC9F0;
            font-size: 0.85rem;
            margin-bottom: 0.25rem;
            word-break: break-all;
        }

        .remove-btn {
            background: #ff4444;
            color: white;
            border: none;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            cursor: pointer;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .remove-btn:hover {
            background: #ff6666;
            transform: scale(1.1);
        }

        .chat-input-container {
            padding: 1rem 1.5rem;
            background: rgba(0, 0, 0, 0.1);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            gap: 0.75rem;
            align-items: center;
        }

        .chat-attach-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #4CC9F0;
            padding: 0.6rem;
            border-radius: 50%;
            cursor: pointer;
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            transition: all 0.3s ease;
        }

        .chat-attach-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(76, 201, 240, 0.4);
        }

        .chat-input-container input[type="text"] {
            flex: 1;
            padding: 0.75rem 1rem;
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.3);
            color: white;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .chat-input-container input[type="text"]:focus {
            border-color: #4CC9F0;
            box-shadow: 0 0 15px rgba(76, 201, 240, 0.4);
            background: rgba(0, 0, 0, 0.5);
        }

        .chat-send-btn {
            background: linear-gradient(45deg, #E94057, #8A2BE2);
            border: none;
            color: white;
            padding: 0.75rem 1.2rem;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(233, 64, 87, 0.4);
        }

        .chat-send-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(233, 64, 87, 0.6);
        }

        .send-icon {
            font-size: 1.1rem;
            font-weight: bold;
        }

        /* Responsive Design */
        @media (max-width: 480px) {
            .chat-modal-content {
                width: 95vw;
                max-height: 85vh;
                margin: auto;
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
            }

            .chat-header {
                padding: 0.75rem 1rem;
            }

            .chat-messages {
                padding: 1rem;
                max-height: 300px;
            }

            .chat-input-container {
                padding: 0.75rem 1rem;
            }

            .chat-message {
                max-width: 85%;
                font-size: 0.9rem;
            }
        }

        @media (max-width: 360px) {
            .chat-modal-content {
                width: 98vw;
            }

            .chat-input-container {
                gap: 0.5rem;
            }

            .chat-attach-btn {
                width: 40px;
                height: 40px;
                font-size: 1rem;
            }

            .chat-send-btn {
                padding: 0.6rem 1rem;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <a href="/" class="site-logo" style="position: absolute; left: 1rem; top: 10px;">
            <img src="/static/logo.svg" alt="Adultlyf Logo" style="height: 80px; width: auto; vertical-align: middle; margin-right: 15px;">
        </a>
        <h1>Escorts</h1>
        <nav style="position: absolute; top: 1rem; right: 1rem; text-align: center;">
            <a href="index.html" class="escort-button" style="font-size: 1.5rem; padding: 0.5rem 1rem;">🏠 Home</a>
            <button id="becomeModelBtn" class="become-model-btn" style="margin-left: 1rem;">Become a Model</button>
        </nav>
    </header>
    <div class="container">
        <a href="index.html" class="back-link">&larr; Back to Home</a>
        <a href="admin/escorts" style="display: none;">Admin</a>

        <!-- Location Filter -->
        <div class="filter-section" style="background: #2a2a2a; padding: 1rem; border-radius: 8px; margin-bottom: 2rem;">
            <h3 style="margin: 0 0 1rem 0; color: #4CAF50;">Filter by Location</h3>
            <div class="location-filters" id="location-filters">
                <button class="filter-btn active" data-location="all">All Locations</button>
                <!-- Location buttons will be dynamically generated -->
            </div>
        </div>



        <div id="escorts-container">
            <div class="loading">Loading escorts...</div>
        </div>
    </div>

    <!-- Meet Modal -->
    <div id="meetModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Arrange Meeting</h2>
            <form id="meetForm">
                <div class="form-group">
                    <label for="ageVerification">Are you 18+? *</label>
                    <select id="ageVerification" name="ageVerification" required>
                        <option value="">Please select...</option>
                        <option value="yes">Yes</option>
                        <option value="no">No</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="clientName">Your Name *</label>
                    <input type="text" id="clientName" name="clientName" required>
                </div>
                <div class="form-group">
                    <label for="clientLocation">Your Location *</label>
                    <input type="text" id="clientLocation" name="clientLocation" required>
                </div>
                <div class="form-group">
                    <label for="clientContact">Your Contact Info *</label>
                    <input type="text" id="clientContact" name="clientContact" placeholder="Phone, email, or preferred contact method" required>
                </div>
                <div class="form-group">
                    <label for="meetingDetails">Meeting Preferences</label>
                    <textarea id="meetingDetails" name="meetingDetails" placeholder="Any specific preferences or details..."></textarea>
                </div>
                <input type="hidden" id="escortId" name="escortId">
                <button type="submit" class="submit-btn">Submit Request</button>
            </form>
        </div>
    </div>

    <!-- Image Gallery Modal -->
    <div id="galleryModal" class="modal gallery-modal">
        <div class="gallery-content">
            <span class="gallery-close">&times;</span>
            <div class="gallery-container">
                <img id="galleryImage" src="" alt="">
                <button class="gallery-nav gallery-prev" id="galleryPrev">&#10094;</button>
                <button class="gallery-nav gallery-next" id="galleryNext">&#10095;</button>
            </div>
            <div class="gallery-thumbnails" id="galleryThumbnails"></div>
            <div class="gallery-counter" id="galleryCounter">1 / 1</div>
            <button class="gallery-back-btn" id="galleryBackBtn">← Back to Escorts</button>
        </div>
    </div>

    <!-- Chat Modal -->
    <div id="chatModal" class="modal">
        <div class="chat-modal-content">
            <div class="chat-header">
                <div class="chat-header-info">
                    <div class="chat-avatar">💬</div>
                    <div class="chat-title">
                        <h3>Admin Support</h3>
                        <span class="chat-status">Online</span>
                    </div>
                </div>
                <div style="display: flex; gap: 0.5rem;">
                    <button class="chat-minimize-btn" onclick="toggleChatMinimize()" title="Minimize Chat">−</button>
                    <button class="chat-close-btn" onclick="closeChatModal()">&times;</button>
                </div>
            </div>
            <div id="chatMessages" class="chat-messages"></div>
            <div id="chatImagePreviewContainer" class="chat-image-preview">
                <div class="preview-content">
                    <img id="chatImagePreview" src="" alt="Selected image">
                    <div class="preview-info">
                        <div id="chatImageFilename" class="filename"></div>
                        <button type="button" onclick="removeSelectedChatImage()" class="remove-btn">×</button>
                    </div>
                </div>
            </div>
            <div class="chat-input-container">
                <input type="file" id="chatImageInput" accept="image/*" style="display: none;" onchange="handleChatImageSelected(event)">
                <button type="button" class="chat-attach-btn" onclick="document.getElementById('chatImageInput').click()" title="Attach Image">
                    📎
                </button>
                <input type="text" id="chatMessageInput" placeholder="Type your message..." onkeypress="if(event.key === 'Enter') sendChatMessage()">
                <button type="button" onclick="sendChatMessage()" class="chat-send-btn">
                    <span class="send-icon">➤</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Chat Image Modal (prevents easy download by disabling right-click/drag and avoiding new-tab) -->
    <div id="chatImageModal" class="modal">
        <div class="modal-content" style="max-width: 90vw; max-height: 90vh; text-align: center;">
            <span class="close" onclick="closeChatImageModal()">&times;</span>
            <img id="chatModalImage" src="" alt="Chat image" style="max-width: 100%; max-height: 80vh; object-fit: contain; border-radius: 8px;" draggable="false">
        </div>
    </div>

    <!-- Model Registration Modal -->
    <div id="modelModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModelModal()">&times;</span>

                        <option value="very_fair">Very Fair</option>

    <script>
        let escorts = [];
        let currentPhotoIndices = {};
        let currentFilter = 'all';

        let currentGalleryEscort = null;
        let currentGalleryIndex = 0;
        let currentRequestId = null;
        let chatPollingInterval = null;

        function checkForActiveChat() {
            const storedRequestId = localStorage.getItem('currentChatRequestId');
            const storedClientName = localStorage.getItem('currentChatClientName');
            if (storedRequestId && storedClientName) {
                // Check if chat is still active by fetching messages
                fetch(`/chat/${storedRequestId}`)
                    .then(response => response.json())
                    .then(data => {
                        // Check if chat was ended by admin
                        const endedByAdmin = data.messages.some(msg =>
                            msg.sender === 'system' && (msg.message.includes('ended') || msg.message.includes('closed'))
                        );
                        if (!endedByAdmin) {
                            showResumeChatButton(storedRequestId, storedClientName);
                        } else {
                            // Chat ended, remove from storage
                            localStorage.removeItem('currentChatRequestId');
                            localStorage.removeItem('currentChatClientName');
                        }
                    })
                    .catch(error => {
                        console.error('Error checking for active chat:', error);
                        // On error, assume chat is still active and show resume button
                        showResumeChatButton(storedRequestId, storedClientName);
                    });
            }
        }

        function showResumeChatButton(requestId, clientName) {
            // Remove existing button if any
            const existingButton = document.getElementById('resumeChatBtn');
            if (existingButton) {
                existingButton.remove();
            }

            const resumeButton = document.createElement('button');
            resumeButton.id = 'resumeChatBtn';
            resumeButton.textContent = '💬 Resume Chat';
            resumeButton.style.cssText = `
                position: fixed;
                bottom: 20px;
                right: 20px;
                background: linear-gradient(45deg, #E94057, #8A2BE2);
                color: white;
                border: none;
                border-radius: 50px;
                padding: 12px 20px;
                cursor: pointer;
                font-weight: bold;
                font-size: 14px;
                box-shadow: 0 4px 15px rgba(0,0,0,0.3);
                z-index: 1001;
                animation: pulse 2s infinite;
            `;
            resumeButton.onclick = () => {
                resumeChatSession(requestId, clientName);
            };
            document.body.appendChild(resumeButton);

            // Add pulse animation
            const style = document.createElement('style');
            style.textContent = `
                @keyframes pulse {
                    0% { transform: scale(1); }
                    50% { transform: scale(1.05); }
                    100% { transform: scale(1); }
                }
            `;
            document.head.appendChild(style);
        }

        function resumeChatSession(requestId, clientName) {
            // Remove resume button
            const resumeButton = document.getElementById('resumeChatBtn');
            if (resumeButton) {
                resumeButton.remove();
            }

            // Restore the chat modal
            showChatModal(requestId, clientName);
        }

        document.addEventListener("DOMContentLoaded", function() {
            loadEscorts();
            checkForActiveChat();

            // Load any existing chat session on page load
            loadChatSession();

            // Modal functionality
            const modal = document.getElementById('meetModal');
            const closeBtn = document.querySelector('.close');

            closeBtn.onclick = function() {
                modal.style.display = 'none';
            }

            window.onclick = function(event) {
                if (event.target == modal) {
                    modal.style.display = 'none';
                }
            }

            // Gallery modal functionality
            const galleryModal = document.getElementById('galleryModal');
            const galleryCloseBtn = document.querySelector('.gallery-close');

            galleryCloseBtn.onclick = function() {
                galleryModal.style.display = 'none';
            }

            window.onclick = function(event) {
                if (event.target == galleryModal) {
                    galleryModal.style.display = 'none';
                }
            }

            // Gallery navigation
            document.getElementById('galleryPrev').addEventListener('click', () => changeGalleryImage(-1));
            document.getElementById('galleryNext').addEventListener('click', () => changeGalleryImage(1));

            // Gallery back button
            document.getElementById('galleryBackBtn').addEventListener('click', () => {
                document.getElementById('galleryModal').style.display = 'none';
            });

            // Keyboard navigation
            document.addEventListener('keydown', function(event) {
                if (galleryModal.style.display === 'block') {
                    if (event.key === 'ArrowLeft') {
                        changeGalleryImage(-1);
                    } else if (event.key === 'ArrowRight') {
                        changeGalleryImage(1);
                    } else if (event.key === 'Escape') {
                        galleryModal.style.display = 'none';
                    }
                }
            });

            // Become a Model button
            document.getElementById('becomeModelBtn').addEventListener('click', function() {
                document.getElementById('modelModal').style.display = 'block';
            });

            // Form submission
            document.getElementById('meetForm').addEventListener('submit', function(e) {
                e.preventDefault();
                submitMeetRequest();
            });

            // Model form submission
            document.getElementById('modelForm').addEventListener('submit', function(e) {
                e.preventDefault();
                submitModelApplication();
            });
        });

        function loadEscorts() {
            fetch("escorts.json")
                .then(response => response.json())
                .then(data => {
                    escorts = data;
                    generateLocationFilters();
                    displayEscorts();
                })
                .catch(error => {
                    console.error("Error loading escorts:", error);
                    document.getElementById('escorts-container').innerHTML =
                        '<div style="text-align: center; padding: 2rem; color: #ccc;">Error loading escorts. Please try again later.</div>';
                });
        }

        function generateLocationFilters() {
            const locationFilters = document.getElementById('location-filters');
            const locations = [...new Set(escorts.map(escort => escort.location))].sort();

            locations.forEach(location => {
                const button = document.createElement('button');
                button.className = 'filter-btn';
                button.setAttribute('data-location', location);
                button.textContent = location;
                button.addEventListener('click', () => filterEscorts(location));
                locationFilters.appendChild(button);
            });
        }

        function filterEscorts(location) {
            currentFilter = location;

            // Update active button
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            document.querySelector(`[data-location="${location}"]`).classList.add('active');

            displayEscorts();
        }

        function displayEscorts() {
            const container = document.getElementById('escorts-container');

            // Filter escorts based on current filter
            const filteredEscorts = currentFilter === 'all'
                ? escorts
                : escorts.filter(escort => escort.location === currentFilter);

            if (filteredEscorts.length === 0) {
                container.innerHTML = '<div style="text-align: center; padding: 2rem; color: #ccc;">No escorts available for the selected location.</div>';
                return;
            }

            let html = '<div class="escort-grid">';

            filteredEscorts.forEach(escort => {
                currentPhotoIndices[escort.id] = 0;

                // Ensure photos array exists and has content
                const photos = escort.photos && escort.photos.length > 0 ? escort.photos : ['/uploads/dummy_image.jpg'];

                html += `
                    <div class="escort-card">
                        <div class="photo-album" data-escort-id="${escort.id}">
                            ${photos.map((photo, index) =>
                                `<img src="${photo}" alt="${escort.name}" class="${index === 0 ? 'active' : ''}" onerror="handleImageError(this)" onload="handleImageLoad(this)">`
                            ).join('')}
                            <button class="photo-nav prev" onclick="changePhoto(${escort.id}, -1)">&#10094;</button>
                            <button class="photo-nav next" onclick="changePhoto(${escort.id}, 1)">&#10095;</button>
                            <div class="photo-indicators">
                                ${photos.map((_, index) =>
                                    `<div class="indicator ${index === 0 ? 'active' : ''}" onclick="setPhoto(${escort.id}, ${index})"></div>`
                                ).join('')}
                            </div>
                        </div>
                        <div class="escort-info">
                            <div class="escort-name">${escort.name}</div>
                            <div class="escort-details">
                                <p><strong>Age:</strong> ${escort.age}</p>
                                <p><strong>Location:</strong> ${escort.location}</p>
                                <p><strong>Preference:</strong> ${escort.sexual_preference}</p>
                                <p>${escort.description}</p>
                            </div>
                            <button class="meet-btn" onclick="openMeetModal(${escort.id})">Meet</button>
                        </div>
                    </div>
                `;
            });

            html += '</div>';
            container.innerHTML = html;

            // Add click event listeners to photo albums for gallery
            document.querySelectorAll('.photo-album').forEach(album => {
                album.addEventListener('click', function() {
                    const escortId = parseInt(this.getAttribute('data-escort-id'));
                    openGallery(escortId);
                });
            });
        }

        function handleImageError(img) {
            console.warn('Image failed to load:', img.src);

            // Prevent multiple retry attempts on the same image
            if (img.dataset.retryCount && parseInt(img.dataset.retryCount) >= 3) {
                console.warn('Max retries reached for:', img.src);
                // Show a permanent placeholder
                img.style.display = 'none';
                const placeholder = document.createElement('div');
                placeholder.className = 'image-placeholder';
                placeholder.textContent = '📷 Image unavailable';
                placeholder.style.cssText = `
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    width: 100%;
                    height: 100%;
                    background: linear-gradient(45deg, rgba(255,0,0,0.1), rgba(128,128,128,0.1));
                    color: #ff6666;
                    font-size: 1rem;
                    border: 2px solid rgba(255,0,0,0.3);
                    border-radius: 8px;
                `;
                img.parentNode.insertBefore(placeholder, img);
                return;
            }

            // Show a temporary placeholder
            img.style.display = 'none';
            const placeholder = document.createElement('div');
            placeholder.className = 'image-placeholder';
            placeholder.textContent = '📷 Retrying...';
            placeholder.style.cssText = `
                display: flex;
                align-items: center;
                justify-content: center;
                width: 100%;
                height: 100%;
                background: linear-gradient(45deg, rgba(255,0,255,0.1), rgba(0,255,255,0.1));
                color: #00ffff;
                font-size: 1rem;
                border: 2px dashed rgba(255,0,255,0.3);
                border-radius: 8px;
            `;

            // Insert placeholder before the image
            img.parentNode.insertBefore(placeholder, img);

            // Increment retry count
            const retryCount = parseInt(img.dataset.retryCount || 0) + 1;
            img.dataset.retryCount = retryCount;

            // Try to reload the image after a longer delay (5 seconds, then 10, then 15)
            const delay = 5000 + (retryCount - 1) * 5000;
            setTimeout(() => {
                img.style.display = '';
                placeholder.remove();
                // Clean up any existing cache buster parameters and add a fresh one
                const baseSrc = img.src.split('?')[0];
                img.src = baseSrc + '?t=' + Date.now();
            }, delay);
        }

        function handleImageLoad(img) {
            console.log('Image loaded successfully:', img.src);
            // Remove any placeholder that might exist
            const placeholder = img.previousElementSibling;
            if (placeholder && placeholder.classList.contains('image-placeholder')) {
                placeholder.remove();
            }
        }

        function changePhoto(escortId, direction) {
            event.stopPropagation();
            const escort = escorts.find(e => e.id === escortId);
            if (!escort) return;

            const currentIndex = currentPhotoIndices[escortId];
            let newIndex = currentIndex + direction;

            if (newIndex < 0) newIndex = escort.photos.length - 1;
            if (newIndex >= escort.photos.length) newIndex = 0;

            setPhoto(escortId, newIndex);
        }

        function setPhoto(escortId, index) {
            event.stopPropagation();
            const album = document.querySelector(`.photo-album[data-escort-id="${escortId}"]`);
            const images = album.querySelectorAll('img');
            const indicators = album.querySelectorAll('.indicator');

            images.forEach(img => img.classList.remove('active'));
            indicators.forEach(ind => ind.classList.remove('active'));

            images[index].classList.add('active');
            indicators[index].classList.add('active');

            currentPhotoIndices[escortId] = index;
        }

        function openMeetModal(escortId) {
            const escort = escorts.find(e => e.id === escortId);
            if (!escort) return;

            document.getElementById('escortId').value = escortId;
            document.getElementById('meetModal').style.display = 'block';

            // Reset form
            document.getElementById('meetForm').reset();
        }

        async function submitMeetRequest() {
            const formData = new FormData(document.getElementById('meetForm'));
            const ageVerification = formData.get('ageVerification');

            // Check age verification
            if (ageVerification !== 'yes') {
                alert('You must be 18 or older to submit a meeting request.');
                return;
            }

            const data = {
                escortId: formData.get('escortId'),
                clientName: formData.get('clientName'),
                clientLocation: formData.get('clientLocation'),
                clientContact: formData.get('clientContact'),
                meetingDetails: formData.get('meetingDetails'),
                ageVerification: ageVerification
            };

            console.log('Submitting meet request with data:', data);

            try {
                // Show loading state
                const submitBtn = document.querySelector('#meetForm button[type="submit"]');
                if (submitBtn) {
                    submitBtn.disabled = true;
                    submitBtn.textContent = 'Submitting...';
                }

                // Send request to server FIRST
                const response = await fetch('/meet', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data)
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    alert('Error: ' + (errorData.error || 'Failed to submit meeting request'));
                    if (submitBtn) {
                        submitBtn.disabled = false;
                        submitBtn.textContent = 'Submit Request';
                    }
                    return;
                }

                const result = await response.json();
                console.log('Server response:', result);

                if (result.success) {
                    // Close meet modal
                    document.getElementById('meetModal').style.display = 'none';

                    // Show chat modal with the CORRECT server-generated request ID
                    showChatModal(result.request_id, data.clientName);
                } else {
                    alert('Error: ' + result.error);
                }

                // Reset button
                if (submitBtn) {
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Submit Request';
                }

            } catch (error) {
                console.error('Error:', error);
                alert('Error processing your request. Please try again.');
                // Reset button on error
                const submitBtn = document.querySelector('#meetForm button[type="submit"]');
                if (submitBtn) {
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Submit Request';
                }
            }
        }

        function showChatModal(requestId, clientName) {
            currentRequestId = requestId;

            // Save chat session to localStorage for persistence
            localStorage.setItem('currentChatRequestId', requestId);
            localStorage.setItem('currentChatClientName', clientName);

            // Clear previous messages
            document.getElementById('chatMessages').innerHTML = '';

            // Add welcome message
            addChatMessage('system', `Welcome ${clientName}! Your meeting request has been submitted. One of our admins, Natasha will respond to you shortly.`);

            // Start polling for messages
            startChatPolling(requestId);

            // Show the modal
            document.getElementById('chatModal').style.display = 'block';
        }

        function addChatMessage(sender, message) {
            const chatMessages = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `chat-message ${sender}`;

            const timestamp = new Date().toLocaleTimeString();

            // Server already sanitizes messages for XSS, trust the server-sanitized content

            messageDiv.innerHTML = `
                <div class="message-content">${message}</div>
                <div class="message-time">${timestamp}</div>
            `;

            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function startChatPolling(requestId) {
            // Clear any existing interval
            if (chatPollingInterval) {
                clearInterval(chatPollingInterval);
            }

            // Poll every 3 seconds, but skip if we recently fetched messages
            chatPollingInterval = setInterval(() => {
                // Only poll if we haven't fetched messages in the last 3 seconds
                const now = Date.now();
                if (!window.lastFetchTime || (now - window.lastFetchTime) > 3000) {
                    fetchChatMessages(requestId);
                }
            }, 3000);
        }

        async function fetchChatMessages(requestId) {
            try {
                const response = await fetch(`/chat/${requestId}`);
                const data = await response.json();

                const chatMessages = document.getElementById('chatMessages');
                const existingMessageIds = new Set(Array.from(chatMessages.children).map(child =>
                    child.dataset.messageId).filter(id => id));

                const escapeHtml = (text) => {
                    const div = document.createElement('div');
                    div.textContent = text ?? '';
                    return div.innerHTML;
                };

                data.messages.forEach(msg => {
                    if (!existingMessageIds.has(msg.id)) {
                        const messageDiv = document.createElement('div');
                        messageDiv.className = `chat-message ${msg.sender}`;
                        messageDiv.dataset.messageId = msg.id;

                        const timestamp = new Date(msg.timestamp).toLocaleTimeString();

                        // Server already sanitizes messages for XSS, trust the server-sanitized content
                        const safeText = msg.message ? msg.message.replace(/\n/g, '<br>') : '';
                        let content = '';
                        if (msg.image_url) {
                            content += `<img src="${msg.image_url}" alt="Sent image" class="chat-message-image" onclick="openChatImage('${msg.image_url}')">`;
                        }
                        if (safeText) {
                            content += `<div class="message-content">${safeText}</div>`;
                        }
                        messageDiv.innerHTML = `
                            ${content}
                            <div class="message-time">${timestamp}</div>
                        `;

                        chatMessages.appendChild(messageDiv);
                    }
                });

                chatMessages.scrollTop = chatMessages.scrollHeight;
            } catch (error) {
                console.error('Error fetching chat messages:', error);
            }
        }

        async function sendChatMessage() {
            const messageInput = document.getElementById('chatMessageInput');
            const message = messageInput.value.trim();
            const imageFile = document.getElementById('chatImageInput').files[0];

            if ((!message && !imageFile) || !currentRequestId) return;

            // Store message data for immediate display
            const messageData = {
                sender: 'client',
                message: message,
                image_url: null
            };

            // Generate a temporary ID for the message
            const tempMessageId = 'temp-' + Date.now();

            try {
                let response;
                if (imageFile) {
                    const formData = new FormData();
                    formData.append('sender', 'client');  // Add sender for image messages
                    formData.append('image', imageFile);
                    if (message) {
                        formData.append('message', message);
                    }

                    response = await fetch(`/chat/${currentRequestId}`, {
                        method: 'POST',
                        body: formData
                    });

                    // For images, create object URL for immediate display
                    if (response.ok) {
                        messageData.image_url = URL.createObjectURL(imageFile);
                    }
                } else {
                    response = await fetch(`/chat/${currentRequestId}`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            sender: 'client',
                            message: message
                        })
                    });
                }

                const result = await response.json();

                if (result.success) {
                    // Clear inputs immediately
                    messageInput.value = '';
                    removeSelectedChatImage();

                    // Fetch messages to display the sent message from server
                    fetchChatMessages(currentRequestId);
                } else {
                    console.error('Failed to send message:', result);
                }
            } catch (error) {
                console.error('Error sending message:', error);
                // Even on error, show the message locally so user thinks it sent
                addChatMessage('client', message);
                messageInput.value = '';
                removeSelectedChatImage();
            }
        }

        function openChatImage(imageUrl) {
            const modal = document.getElementById('chatImageModal');
            const modalImg = document.getElementById('chatModalImage');
            if (!modal || !modalImg) return;

            modalImg.src = imageUrl;
            modal.style.display = 'block';
        }

        function closeChatImageModal() {
            const modal = document.getElementById('chatImageModal');
            const modalImg = document.getElementById('chatModalImage');
            if (modal) modal.style.display = 'none';
            if (modalImg) modalImg.src = '';
        }

        function handleChatImageSelected(e) {
            const file = e.target.files[0];
            if (!file) {
                removeSelectedChatImage();
                return;
            }

            if (!file.type.startsWith('image/')) {
                alert('Please select an image file.');
                e.target.value = '';
                removeSelectedChatImage();
                return;
            }

            const previewContainer = document.getElementById('chatImagePreviewContainer');
            const previewImg = document.getElementById('chatImagePreview');
            const filenameDiv = document.getElementById('chatImageFilename');

            const objectUrl = URL.createObjectURL(file);
            previewImg.src = objectUrl;
            previewImg.onload = function() {
                URL.revokeObjectURL(objectUrl);
            };
            filenameDiv.textContent = file.name;
            previewContainer.style.display = 'block';
        }

        function removeSelectedChatImage() {
            const input = document.getElementById('chatImageInput');
            const previewContainer = document.getElementById('chatImagePreviewContainer');
            const previewImg = document.getElementById('chatImagePreview');
            const filenameDiv = document.getElementById('chatImageFilename');

            if (input) input.value = '';
            if (previewImg) previewImg.src = '';
            if (filenameDiv) filenameDiv.textContent = '';
            if (previewContainer) previewContainer.style.display = 'none';
        }

        // Close chat image modal when clicking outside the modal content
        (function() {
            const chatImageModal = document.getElementById('chatImageModal');
            if (chatImageModal) {
                chatImageModal.addEventListener('click', function(e) {
                    if (e.target === this) {
                        closeChatImageModal();
                    }
                });
            }
        })();

        // Discourage saving: prevent right-click and dragging of chat images
        document.addEventListener('contextmenu', function(e) {
            const t = e.target;
            const isChatImage = !!(t && t.classList && t.classList.contains('chat-message-image'));
            const isModalImage = !!(t && t.id === 'chatModalImage');
            if (isChatImage || isModalImage) {
                e.preventDefault();
                return false;
            }
        });

        document.addEventListener('dragstart', function(e) {
            const t = e.target;
            const isChatImage = !!(t && t.classList && t.classList.contains('chat-message-image'));
            const isModalImage = !!(t && t.id === 'chatModalImage');
            if (isChatImage || isModalImage) {
                e.preventDefault();
                return false;
            }
        });

        function closeChatModal() {
            // Save chat state before closing
            if (currentRequestId) {
                saveChatSession();
            }

            document.getElementById('chatModal').style.display = 'none';
            if (chatPollingInterval) {
                clearInterval(chatPollingInterval);
                chatPollingInterval = null;
            }
            currentRequestId = null;

            // Show chat indicator if there's an active chat
            showChatIndicator();
        }

        function toggleChatMinimize() {
            const chatModal = document.getElementById('chatModal');
            const chatContent = chatModal.querySelector('.chat-modal-content');
            const minimizeBtn = chatModal.querySelector('.chat-minimize-btn');

            chatContent.classList.toggle('minimized');

            // Update button text
            if (chatContent.classList.contains('minimized')) {
                minimizeBtn.innerHTML = '+';
                minimizeBtn.title = 'Maximize Chat';
            } else {
                minimizeBtn.innerHTML = '−';
                minimizeBtn.title = 'Minimize Chat';
            }
        }

        function saveChatSession() {
            if (currentRequestId) {
                localStorage.setItem('currentChatRequestId', currentRequestId);
                localStorage.setItem('currentChatClientName', document.querySelector('.chat-title h3').textContent.replace('Chat with ', '').replace(' (Request #', ''));
            }
        }

        function loadChatSession() {
            const savedRequestId = localStorage.getItem('currentChatRequestId');
            const savedClientName = localStorage.getItem('currentChatClientName');
            if (savedRequestId && savedClientName) {
                // Check if chat session is still active (not ended by admin)
                fetch(`/chat/${savedRequestId}`)
                    .then(response => response.json())
                    .then(data => {
                        // Check if chat was ended by admin
                        const endedByAdmin = data.messages.some(msg =>
                            msg.sender === 'system' && msg.message.includes('ended by administrator')
                        );

                        if (!endedByAdmin && data.messages.length > 0) {
                            // Restore the chat
                            currentRequestId = savedRequestId;
                            document.querySelector('.chat-title h3').textContent = `Chat with ${savedClientName}`;

                            // Restore messages
                            const chatMessages = document.getElementById('chatMessages');
                            chatMessages.innerHTML = '';

                            data.messages.forEach(msg => {
                                const messageDiv = document.createElement('div');
                                messageDiv.className = `chat-message ${msg.sender}`;
                                messageDiv.dataset.messageId = msg.id;

                                const timestamp = new Date(msg.timestamp).toLocaleTimeString();
                                const safeText = msg.message ? msg.message.replace(/\n/g, '<br>') : '';
                                let content = '';
                                if (msg.image_url) {
                                    content += `<img src="${msg.image_url}" alt="Sent image" class="chat-message-image" onclick="openChatImage('${msg.image_url}')">`;
                                }
                                if (safeText) {
                                    content += `<div class="message-content">${safeText}</div>`;
                                }
                                messageDiv.innerHTML = `${content}<div class="message-time">${timestamp}</div>`;
                                chatMessages.appendChild(messageDiv);
                            });

                            // Start polling
                            startChatPolling(savedRequestId);

                            // Show the chat
                            document.getElementById('chatModal').style.display = 'block';

                            // Hide chat indicator since chat is now open
                            hideChatIndicator();
                        } else {
                            // Chat was ended or doesn't exist, remove from localStorage
                            localStorage.removeItem('currentChatRequestId');
                            localStorage.removeItem('currentChatClientName');
                        }
                    })
                    .catch(error => {
                        console.error('Error loading saved chat session:', error);
                        localStorage.removeItem('currentChatRequestId');
                        localStorage.removeItem('currentChatClientName');
                    });
            }
        }

        function showChatIndicator() {
            // Remove existing indicator
            const existingIndicator = document.getElementById('chatIndicator');
            if (existingIndicator) {
                existingIndicator.remove();
            }

            // Check if there's an active chat session
            const savedRequestId = localStorage.getItem('currentChatRequestId');
            const savedClientName = localStorage.getItem('currentChatClientName');
            if (savedRequestId && savedClientName) {
                // Only show indicator if chat modal is not currently open
                if (document.getElementById('chatModal').style.display !== 'block') {
                    const indicator = document.createElement('div');
                    indicator.id = 'chatIndicator';
                    indicator.innerHTML = `
                        <div style="
                            position: fixed;
                            bottom: 20px;
                            right: 20px;
                            background: linear-gradient(135deg, #E94057, #8A2BE2);
                            color: white;
                            padding: 15px 20px;
                            border-radius: 50px;
                            cursor: pointer;
                            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
                            z-index: 1000;
                            font-weight: bold;
                            animation: pulse 2s infinite;
                            border: 2px solid rgba(255,255,255,0.2);
                        " onclick="restoreChatSession()">
                            💬 Resume Chat
                        </div>
                        <style>
                            @keyframes pulse {
                                0% { transform: scale(1); }
                                50% { transform: scale(1.05); }
                                100% { transform: scale(1); }
                            }
                        </style>
                    `;
                    document.body.appendChild(indicator);
                }
            }
        }

        function hideChatIndicator() {
            const indicator = document.getElementById('chatIndicator');
            if (indicator) {
                indicator.remove();
            }
        }

        function restoreChatSession() {
            const savedRequestId = localStorage.getItem('currentChatRequestId');
            const savedClientName = localStorage.getItem('currentChatClientName');
            if (savedRequestId && savedClientName) {
                loadChatSession();
            }
        }

        function endChatSession() {
            // Clear all chat-related data and intervals
            if (chatPollingInterval) {
                clearInterval(chatPollingInterval);
                chatPollingInterval = null;
            }

            // Hide chat elements
            document.getElementById('chatModal').style.display = 'none';

            currentRequestId = null;
        }

        function openGallery(escortId) {
            const escort = escorts.find(e => e.id === escortId);
            if (!escort || !escort.photos || escort.photos.length === 0) return;

            currentGalleryEscort = escort;
            currentGalleryIndex = currentPhotoIndices[escortId] || 0;

            updateGallery();
            document.getElementById('galleryModal').style.display = 'block';
        }

        function updateGallery() {
            if (!currentGalleryEscort) return;

            const galleryImage = document.getElementById('galleryImage');
            const galleryThumbnails = document.getElementById('galleryThumbnails');
            const galleryCounter = document.getElementById('galleryCounter');

            // Update main image
            galleryImage.src = currentGalleryEscort.photos[currentGalleryIndex];
            galleryImage.alt = currentGalleryEscort.name;

            // Update counter
            galleryCounter.textContent = `${currentGalleryIndex + 1} / ${currentGalleryEscort.photos.length}`;

            // Update thumbnails
            galleryThumbnails.innerHTML = '';
            currentGalleryEscort.photos.forEach((photo, index) => {
                const thumbnail = document.createElement('img');
                thumbnail.src = photo;
                thumbnail.alt = `${currentGalleryEscort.name} ${index + 1}`;
                thumbnail.className = `gallery-thumbnail ${index === currentGalleryIndex ? 'active' : ''}`;
                thumbnail.addEventListener('click', () => setGalleryImage(index));
                galleryThumbnails.appendChild(thumbnail);
            });
        }

        function changeGalleryImage(direction) {
            if (!currentGalleryEscort) return;

            let newIndex = currentGalleryIndex + direction;

            if (newIndex < 0) newIndex = currentGalleryEscort.photos.length - 1;
            if (newIndex >= currentGalleryEscort.photos.length) newIndex = 0;

            setGalleryImage(newIndex);
        }

        function setGalleryImage(index) {
            if (!currentGalleryEscort || index < 0 || index >= currentGalleryEscort.photos.length) return;

            currentGalleryIndex = index;
            updateGallery();
        }

        async function submitModelApplication() {
            const form = document.getElementById('modelForm');
            const formData = new FormData(form);
            const age = parseInt(formData.get('age'));

            // Check age requirement
            if (age < 18) {
                alert('You must be 18 years or older to apply as a model.');
                return;
            }

            try {
                const response = await fetch('/apply-model', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();
                console.log(result);

                if (response.ok && result.success) {
                    alert('Thank you for your application! We will review it and get back to you soon.');
                    document.getElementById('modelModal').style.display = 'none';
                    document.getElementById('modelForm').reset();
                } else {
                    alert('Error: ' + (result.error || 'Unknown error occurred'));
                }
            } catch (error) {
                console.error('Error submitting model application:', error);
                alert('Error submitting application. Please try again.');
            }
        }

        function closeModelModal() {
            document.getElementById('modelModal').style.display = 'none';
            document.getElementById('modelForm').reset();
        }
    </script>
</body>
</html>
