<!DOCTYPE html>
<html>
<head>
    <title>Admin Login</title>
    <style>
        body { font-family: Arial, sans-serif; background: #1a1a1a; color: #fff; margin: 0; padding: 2rem; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .login-container { background: #2a2a2a; padding: 2rem; border-radius: 8px; width: 100%; max-width: 400px; }
        h1 { color: #4CAF50; text-align: center; margin-bottom: 1rem; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; }
        input { width: 100%; padding: 0.5rem; background: #333; color: #fff; border: 1px solid #555; border-radius: 4px; }
        button { background: #4CAF50; color: white; border: none; padding: 0.75rem 1rem; cursor: pointer; width: 100%; border-radius: 4px; }
        button:hover { background: #45a049; }
        .error { color: #f44336; text-align: center; margin-top: 1rem; }
    </style>
</head>
<body>
    <a href="/" class="site-logo" style="position: absolute; left: 1rem; top: 10px;">
        <img src="/static/logo.svg" alt="Adultlyf Logo" style="height: 80px; width: auto; vertical-align: middle; margin-right: 15px;">
    </a>
    <div class="login-container">
        <h1>Admin Login</h1>
        <form method="POST" action="/admin/login">
            {{ form.hidden_tag() }}
            <div class="form-group">
                <label for="password">Password:</label>
                {{ form.password(class="form-control") }}
            </div>
            <button type="submit">Login</button>
        </form>
        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}
    </div>
</body>
</html>
