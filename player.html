<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adultlyf - Video Player</title>
    <link rel="icon" type="image/svg+xml" href="/static/logo.svg">
    <link rel="apple-touch-icon" href="/static/logo.svg">
    <link rel="stylesheet" href="/static/main.css">
    <style>
        /* Video Player Specific Styles */
        .player-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem 2rem;
        }

        .back-link {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            border-radius: 25px;
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            transition: var(--transition);
            margin-bottom: 2rem;
            box-shadow: var(--shadow-light);
        }

        .back-link:hover {
            background: var(--primary-gradient);
            color: white;
            border-color: transparent;
            transform: translateY(-2px);
            box-shadow: var(--shadow-medium);
        }

        .video-title {
            text-align: center;
            font-size: 2rem;
            font-weight: 600;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 2rem;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 aspect ratio */
            height: 0;
            overflow: hidden;
            background: var(--dark-bg);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-heavy);
            margin-bottom: 3rem;
        }

        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
            border-radius: var(--border-radius);
            pointer-events: auto;
        }

        .related-videos {
            margin-top: 3rem;
        }

        .related-videos h3 {
            font-size: 1.8rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 2rem;
            text-align: center;
        }

        /* Video fallback message */
        .video-fallback {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            padding: 3rem;
            background: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-light);
        }

        .video-fallback h2 {
            color: var(--text-primary);
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
        }

        .video-fallback p {
            color: var(--text-secondary);
            margin-bottom: 2rem;
            font-size: 1.1rem;
        }

        .watch-button {
            display: inline-block;
            padding: 1rem 2rem;
            background: var(--secondary-gradient);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1.2rem;
            transition: var(--transition);
            box-shadow: var(--shadow-medium);
        }

        .watch-button:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-heavy);
        }

        .video-fallback .note {
            color: var(--text-muted);
            margin-top: 2rem;
            font-size: 0.9rem;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .player-container {
                padding: 1rem;
            }

            .video-title {
                font-size: 1.5rem;
                margin-bottom: 1.5rem;
            }

            .video-wrapper {
                margin-bottom: 2rem;
            }

            .related-videos h3 {
                font-size: 1.5rem;
            }
        }

        @media (max-width: 480px) {
            .player-container {
                padding: 0.5rem;
            }

            .video-title {
                font-size: 1.2rem;
                margin-bottom: 1rem;
            }

            .video-wrapper {
                margin-bottom: 1.5rem;
            }

            .related-videos h3 {
                font-size: 1.3rem;
            }

            .back-link {
                padding: 0.625rem 1.25rem;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <a href="/" class="site-logo">
            <img src="/static/logo.svg" alt="Adultlyf Logo">
        </a>
        <h1>Video Player</h1>
        <nav>
            <a href="/" class="escort-button">🏠 Home</a>
        </nav>
    </header>

    <div class="container">
        <a href="/" class="back-link">&larr; Back to Videos</a>

        <form id="search-form" class="search-form">
            <input type="text" id="search-input" placeholder="Search for videos...">
            <button type="submit">Search</button>
        </form>

        <div class="player-container">
            <div id="video-title" class="video-title"></div>
            <div class="video-wrapper">
                <iframe id="video-player" src="" allowfullscreen></iframe>
            </div>
            <div class="related-videos">
                <h3>Related Videos</h3>
                <div id="related-videos" class="video-grid">
                    <!-- Related videos will be loaded here -->
                </div>
            </div>
        </div>
    </div>

    <footer>
        <div class="escort-banner">
            <a href="/escorts.html">
                <span>💋</span>
                <span>FIND YOUR PERFECT COMPANION TONIGHT</span>
                <span>Book Now →</span>
            </a>
        </div>
        <p>&copy; 2026 Adultlyf. All rights reserved.</p>
    </footer>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const urlParams = new URLSearchParams(window.location.search);
            const embedUrl = urlParams.get('embed_url');
            const videoUrl = urlParams.get('video_url');
            const title = urlParams.get('title');

            // Set video title
            if (title) {
                document.getElementById('video-title').textContent = decodeURIComponent(title);
            }

            // Try embedding first, fall back to redirect if it fails
            if (embedUrl && embedUrl.trim() !== '') {
                // Try to embed the video
                const embedFrame = document.createElement('iframe');
                embedFrame.src = decodeURIComponent(embedUrl);
                embedFrame.frameBorder = '0';
                embedFrame.allowFullscreen = true;
                embedFrame.sandbox = 'allow-same-origin allow-scripts allow-forms allow-presentation'; // Prevent navigation
                embedFrame.style.cssText = `
                    position: absolute;
                    top: 0;
                    left: 0;
                    width: 100%;
                    height: 100%;
                    border: 0;
                    border-radius: var(--border-radius);
                `;

                // Add error handling
                embedFrame.onerror = function() {
                    // Embedding failed, show fallback
                    showVideoFallback(videoUrl);
                };

                embedFrame.onload = function() {
                    // Check if iframe loaded successfully by checking content
                    try {
                        const iframeDoc = embedFrame.contentDocument || embedFrame.contentWindow.document;
                        if (iframeDoc && iframeDoc.body && iframeDoc.body.innerHTML.includes('404')) {
                            // 404 detected, show fallback
                            showVideoFallback(videoUrl);
                        } else if (iframeDoc && iframeDoc.body && iframeDoc.body.innerHTML.trim() === '') {
                            // Empty content might indicate blocking, show fallback after delay
                            setTimeout(() => {
                                if (!embedFrame.contentDocument || embedFrame.contentDocument.body.innerHTML.trim() === '') {
                                    showVideoFallback(videoUrl);
                                }
                            }, 3000);
                        }
                    } catch (e) {
                        // Cross-origin restriction, assume it's working
                        console.log('Cross-origin iframe, assuming embed works');
                    }
                };

                document.querySelector('.video-wrapper').innerHTML = '';
                document.querySelector('.video-wrapper').appendChild(embedFrame);
            } else if (videoUrl && videoUrl.trim() !== '') {
                // No embed URL available, show fallback
                showVideoFallback(videoUrl);
            } else {
                // Handle case where no URL is provided
                document.querySelector('.video-wrapper').innerHTML = '<div class="video-fallback"><p>Error: No video URL provided.</p></div>';
            }

            function showVideoFallback(videoUrl) {
                const decodedVideoUrl = decodeURIComponent(videoUrl);
                const message = `
                    <div class="video-fallback">
                        <h2>Video Player</h2>
                        <p>This video cannot be embedded. Click below to watch on the original site.</p>
                        <a href="${decodedVideoUrl}" target="_blank" class="watch-button">
                            Watch Video
                        </a>
                        <p class="note">Opens in new tab for best viewing experience</p>
                    </div>
                `;
                document.querySelector('.video-wrapper').innerHTML = message;
            }

            let allVideos = [];
            let currentVideoUrl = decodeURIComponent(videoUrl || '');

            // Load all videos
            fetch("videos.json")
                .then(response => response.json())
                .then(data => {
                    allVideos = data;
                    displayRelatedVideos(allVideos.filter(video => video.video_url !== currentVideoUrl).slice(0, 12));
                })
                .catch(error => {
                    console.error("Error loading videos:", error);
                    document.getElementById('related-videos').innerHTML = '<p>Could not load videos.</p>';
                });

            function displayRelatedVideos(videoData) {
                const relatedContainer = document.getElementById('related-videos');
                relatedContainer.innerHTML = '';

                videoData.forEach(video => {
                    const videoItem = document.createElement('div');
                    videoItem.classList.add('video-item');

                    const thumbnail = document.createElement('img');
                    thumbnail.src = video.thumbnail;
                    thumbnail.alt = video.title;

                    const videoTitle = document.createElement('div');
                    videoTitle.classList.add('video-item-title');
                    videoTitle.textContent = video.title;

                    videoItem.appendChild(thumbnail);
                    videoItem.appendChild(videoTitle);
                    relatedContainer.appendChild(videoItem);

                    // Add click listener to open this video in new tab
                    videoItem.addEventListener('click', () => {
                        const params = new URLSearchParams({
                            embed_url: encodeURIComponent(video.embed_url),
                            video_url: encodeURIComponent(video.video_url),
                            title: encodeURIComponent(video.title)
                        });
                        window.open(`player.html?${params.toString()}`, '_blank');
                    });
                });
            }

            // Search functionality - opens search results in new tab
            const searchForm = document.getElementById('search-form');
            const searchInput = document.getElementById('search-input');

            function performSearch(event) {
                if (event) event.preventDefault();
                const searchTerm = searchInput.value.trim();
                if (searchTerm !== '') {
                    // Create a temporary link and click it to open in new tab
                    const params = new URLSearchParams({
                        q: encodeURIComponent(searchTerm)
                    });
                    const url = `search.html?${params.toString()}`;

                    // Try window.open first
                    const newWindow = window.open(url, '_blank');

                    // If popup blocked, try alternative method
                    if (!newWindow || newWindow.closed || typeof newWindow.closed == 'undefined') {
                        // Fallback: create a temporary link and click it
                        const link = document.createElement('a');
                        link.href = url;
                        link.target = '_blank';
                        link.style.display = 'none';
                        document.body.appendChild(link);
                        link.click();
                        document.body.removeChild(link);
                    }
                }
            }

            searchForm.addEventListener('submit', performSearch);
            searchInput.addEventListener('keyup', (event) => {
                if (event.key === 'Enter') {
                    performSearch();
                }
            });

            // Prevent iframe clicks from redirecting the parent window
            const videoPlayer = document.getElementById('video-player');

            // Prevent clicks on iframe from navigating away
            videoPlayer.addEventListener('click', function(e) {
                // Allow normal video controls but prevent navigation
                e.stopPropagation();
            });

            // Prevent context menu and right-click navigation
            videoPlayer.addEventListener('contextmenu', function(e) {
                e.preventDefault();
                return false;
            });

            // Prevent iframe from changing parent window location
            videoPlayer.addEventListener('load', function() {
                try {
                    // Monitor for attempts to change window location
                    const checkRedirect = setInterval(() => {
                        // This is a basic check - if the iframe tries to redirect,
                        // we can't prevent it from the parent, but we can detect and reload
                        if (window.location.href !== originalLocation) {
                            // Redirect detected, reload the page to stay on site
                            window.location.reload();
                        }
                    }, 100);

                    // Store original location
                    const originalLocation = window.location.href;

                    // Clear check after 10 seconds (video should be loaded by then)
                    setTimeout(() => clearInterval(checkRedirect), 10000);

                } catch (e) {
                    console.log('Cannot monitor iframe redirects due to cross-origin restrictions');
                }
            });
        });
    </script>
</body>
</html>
